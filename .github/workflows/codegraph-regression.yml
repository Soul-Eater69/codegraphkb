name: CodeGraphKB regression

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Build CodeGraphKB index
        run: codegraph index . --quiet --embed

      - name: Smoke tests
        run: pytest tests/test_smoke.py tests/test_regression.py

      - name: Generate regression report
        run: |
          codegraph regression-report \
            --eval evals/datasets/self_repo_tasks.yaml \
            --edit-eval evals/datasets/self_repo_tasks.yaml \
            --compare bm25,hybrid \
            --save reports/latest.json \
            --markdown reports/latest.md

      - name: Upload regression artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codegraph-regression-report
          path: reports/
          if-no-files-found: warn

      - name: Comment on pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- codegraph-regression-report -->';
            let body = marker + '\n';
            if (fs.existsSync('reports/latest.md')) {
              body += fs.readFileSync('reports/latest.md', 'utf8');
            } else {
              body += '# CodeGraphKB Regression Report\n\nReport generation did not complete.';
            }
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({owner, repo, issue_number});
            const existing = comments.data.find(comment => comment.body && comment.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
