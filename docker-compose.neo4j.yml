name: codegraphkb-neo4j

services:
  neo4j:
    image: neo4j:5-community
    container_name: codegraphkb-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/codegraphkb
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - codegraphkb_neo4j_data:/data
      - codegraphkb_neo4j_logs:/logs

volumes:
  codegraphkb_neo4j_data:
  codegraphkb_neo4j_logs:
