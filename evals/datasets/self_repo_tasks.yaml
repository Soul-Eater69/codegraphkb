# Phase 2.5 — expanded golden dataset for the CodeGraphKB repo itself.
#
# Conventions:
#   - oracle_files / oracle_symbols  : MUST appear in the retrieved pack.
#   - should_exclude_files / should_exclude_symbols
#                                   : MUST NOT appear (used for noise testing).
#   - mode  : explain | edit | debug | refactor | test | impact | security |
#             onboarding | feature
# Match is path-suffix for files and last-segment for symbols.

# ---------- Architecture / explain ----------
- id: explain_retrieval_pipeline
  task: "How does the retrieval pipeline work end-to-end?"
  mode: explain
  budget: 4000
  oracle_files:
    - src/codegraphkb/core/retrieval.py
    - src/codegraphkb/core/search.py
    - src/codegraphkb/api.py
  oracle_symbols:
    - retrieve_context
    - search_symbols
    - classify_intent
  should_exclude_files:
    - tests/test_smoke.py

- id: explain_capsules
  task: "How are Context Capsules generated?"
  mode: explain
  budget: 3000
  oracle_files:
    - src/codegraphkb/core/capsules.py
    - src/codegraphkb/core/indexer.py
  oracle_symbols:
    - build_symbol_capsule
    - index_repository
  should_exclude_files:
    - tests/test_smoke.py

- id: onboarding_overview
  task: "Give me a tour of the codebase — where do I start?"
  mode: onboarding
  budget: 5000
  oracle_files:
    - src/codegraphkb/api.py
    - src/codegraphkb/cli.py
  oracle_symbols:
    - CodeGraphKB
    - cli

- id: explain_hybrid_retrieval
