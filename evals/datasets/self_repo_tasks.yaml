    - retrieve_context

- id: explain_eval_harness
  task: "How does the eval harness measure retrieval quality?"
  mode: explain
  budget: 4000
  oracle_files:
    - src/codegraphkb/eval.py
  oracle_symbols:
    - evaluate
    - _run_task
    - _aggregate

